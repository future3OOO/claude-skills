name: PR138 isolated takeover repair

on:
  push:
    branches: [automation/pr138-takeover]
    paths: [.github/workflows/pr138-takeover.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the subtractive repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {found}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "hooks/tests/test_workflow_hooks.py",
              '''    def red(self, slug: str) -> subprocess.CompletedProcess[str]:
                  """Drive one real valid mapped RED through the workflow.py tdd command for this workflow."""
                  (self.repo / "app.py").write_text("value = 1\\n", encoding="utf-8")
                  return subprocess.run(
                      [sys.executable, str(WORKFLOW), "tdd", "--cwd", str(self.repo), "--slug", slug,
                       "--phase", "red", "--behavior-id", "BM_HOOK",
                       "--", sys.executable, "-c",
                       "import app; assert app.value == 2, 'VALUE_NOT_TWO'"],
                      cwd=ROOT, env=self.env, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False,
                  )
          ''',
              '''    def mapped_test_command(self) -> tuple[str, ...]:
                  """The public unittest Seam shared by the hook RED and GREEN."""
                  (self.repo / "test_app.py").write_text(
                      "import unittest\\n"
                      "import app\\n"
                      "class ValueTests(unittest.TestCase):\\n"
                      "    def test_value(self):\\n"
                      "        self.assertEqual(app.value, 2, 'VALUE_NOT_TWO')\\n",
                      encoding="utf-8",
                  )
                  return (
                      sys.executable,
                      "-m",
                      "unittest",
                      "test_app.ValueTests.test_value",
                  )

              def red(self, slug: str) -> subprocess.CompletedProcess[str]:
                  """Drive one real valid mapped RED through the public workflow Interface."""
                  (self.repo / "app.py").write_text("value = 1\\n", encoding="utf-8")
                  return subprocess.run(
                      [sys.executable, str(WORKFLOW), "tdd", "--cwd", str(self.repo), "--slug", slug,
                       "--phase", "red", "--behavior-id", "BM_HOOK",
                       "--", *self.mapped_test_command()],
                      cwd=ROOT, env=self.env, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False,
                  )
          ''',
          )
          replace(
              "hooks/tests/test_workflow_hooks.py",
              '''             "--phase", "green", "--behavior-id", "BM_HOOK",
                       "--", sys.executable, "-c",
                       "import app; assert app.value == 2, 'VALUE_NOT_TWO'"],
          ''',
              '''             "--phase", "green", "--behavior-id", "BM_HOOK",
                       "--", *self.mapped_test_command()],
          ''',
          )

          replace(
              "hooks/lib/tdd_workflow.py",
              '''def _tdd_parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser(
                  prog="workflow tdd",
                  epilog=(
                      "imported pre-map workflows keep the legacy flags: "
                      "--behavior, --seam, --expected-failure"
                  ),
              )
              parser.add_argument("--repo", "--cwd", dest="repo", default=".")
              parser.add_argument("--slug", required=True)
              mode = parser.add_mutually_exclusive_group(required=True)
              mode.add_argument("--phase", choices=("red", "green"))
              mode.add_argument("--not-required", metavar="REASON")
              parser.add_argument("--behavior-id")
              parser.add_argument("--timeout", type=int, default=900)
              parser.add_argument("runner_command", nargs=argparse.REMAINDER)
              return parser


          def _tdd_route_parser() -> argparse.ArgumentParser:
              """Parse every recorder option that affects mapped-vs-legacy routing."""
              parser = argparse.ArgumentParser(prog="workflow tdd", add_help=False)
              parser.add_argument("--repo", "--cwd", dest="repo", default=".")
              parser.add_argument("--slug")
              parser.add_argument("--phase", choices=("red", "green"))
              parser.add_argument("--not-required", metavar="REASON")
              parser.add_argument("--behavior-id")
              parser.add_argument("--behavior")
              return parser
          ''',
              '''def _tdd_parser() -> argparse.ArgumentParser:
              """The sole grammar for mapped and imported-legacy TDD options."""
              parser = argparse.ArgumentParser(
                  prog="workflow tdd",
                  epilog=(
                      "imported pre-map workflows keep the legacy flags: "
                      "--behavior, --seam, --expected-failure"
                  ),
              )
              parser.add_argument("--repo", "--cwd", dest="repo", default=".")
              parser.add_argument("--slug", required=True)
              mode = parser.add_mutually_exclusive_group(required=True)
              mode.add_argument("--phase", choices=("red", "green"))
              mode.add_argument("--not-required", metavar="REASON")
              parser.add_argument("--behavior-id")
              parser.add_argument("--behavior")
              parser.add_argument("--seam", default="")
              parser.add_argument("--expected-failure", default="")
              parser.add_argument("--timeout", type=int, default=900)
              return parser
          ''',
          )
          replace(
              "hooks/lib/tdd_workflow.py",
              '''def _legacy_parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser(prog="workflow tdd")
              parser.add_argument("--repo", "--cwd", dest="repo", default=".")
              parser.add_argument("--slug", required=True)
              mode = parser.add_mutually_exclusive_group(required=True)
              mode.add_argument("--phase", choices=("red", "green"))
              mode.add_argument("--not-required", metavar="REASON")
              parser.add_argument("--behavior")
              parser.add_argument("--seam", default="")
              parser.add_argument("--expected-failure", default="")
              parser.add_argument("--timeout", type=int, default=900)
              parser.add_argument("runner_command", nargs=argparse.REMAINDER)
              return parser


          ''',
              '',
          )
          replace(
              "hooks/lib/tdd_workflow.py",
              '''    dash = values.index("--") if "--" in values else None
              recorder_region = values if dash is None else values[:dash]
              for value in recorder_region:
                  if value in ("-h", "--help"):
                      _tdd_parser().parse_args(["--help"])
              runner_region = [] if dash is None else values[dash + 1:]
              route, _ = _tdd_route_parser().parse_known_args(recorder_region)
              if route.phase in {"red", "green"} and not runner_region:
                  raise ValueError(
                      "a runner command is required after -- ; place recorder flags "
                      "before the sentinel and the command after it"
                  )
              if not route.slug:
                  raise ValueError("--slug is required")
              identity = resolve_repo_identity(route.repo)
              state, slug, workflow_id = _active_candidate(identity, route.slug)
              items, current = current_map(identity, state)
              legacy = items is None or _legacy_green_candidate(current, workflow_id, route)
              if not legacy and route.behavior_id is None and route.not_required is None:
                  raise WorkflowError(
                      "recorded Behavior Map requires --behavior-id or --not-required; "
                      "legacy free-form --behavior/--seam candidates cannot satisfy it"
                  )
              args = (_legacy_parser() if legacy else _tdd_parser()).parse_args(values)
              if args.not_required is not None:
                  return _not_required(args, identity, state, items)
          ''',
              '''    dash = values.index("--") if "--" in values else None
              recorder_region = values if dash is None else values[:dash]
              runner_region = [] if dash is None else values[dash + 1:]
              args = _tdd_parser().parse_args(recorder_region)
              if args.phase in {"red", "green"} and not runner_region:
                  raise ValueError(
                      "a runner command is required after -- ; place recorder flags "
                      "before the sentinel and the command after it"
                  )
              args.runner_command = runner_region
              identity = resolve_repo_identity(args.repo)
              state, slug, workflow_id = _active_candidate(identity, args.slug)
              items, current = current_map(identity, state)
              legacy = items is None or _legacy_green_candidate(current, workflow_id, args)
              if legacy and args.behavior_id is not None:
                  raise WorkflowError(
                      "imported legacy TDD uses --behavior/--seam, not --behavior-id"
                  )
              if not legacy and (
                  args.behavior is not None or args.seam or args.expected_failure
              ):
                  raise WorkflowError(
                      "mapped TDD uses --behavior-id; legacy --behavior/--seam flags "
                      "cannot satisfy a recorded Behavior Map"
                  )
              if not legacy and args.behavior_id is None and args.not_required is None:
                  raise WorkflowError(
                      "recorded Behavior Map requires --behavior-id or --not-required"
                  )
              if args.not_required is not None:
                  return _not_required(args, identity, state, items)
          ''',
          )

          replace(
              "skills/repo-production-workflow/SKILL.md",
              '''For directly invoked pytest and unittest commands, the recorder verifies that a test ran and that the marker came from a test assertion. An unrecognized exact-bound runner can record only `marker-only-opaque` evidence; that weaker record does not independently prove Seam reach and must be inspected by the lead before it is relied on.
          ''',
              '''For directly invoked pytest and unittest commands, the recorder verifies that a test ran and that the marker came from a test assertion. Mapped RED from any other command fails closed: exact-bound output cannot establish Seam reach or open production edits. Use a supported real runner, or disposition a behavior that already passes as `already-satisfied` with real-Seam evidence.
          ''',
          )
          PY
      - name: Run real-interface contracts
        shell: bash
        run: |
          pip install pytest==8.4.1 ruff==0.16.2
          ruff check --isolated --select E9,F hooks/lib/tdd_workflow.py hooks/tests/test_workflow_hooks.py
          python3 -u hooks/tests/test_tdd_repairs.py
          python3 -u hooks/tests/test_tdd_dispatch.py
          python3 -u hooks/tests/test_workflow_hooks.py
          bash hooks/tests/run.sh
      - name: Collapse staging commits and publish
        shell: bash
        env:
          BRANCH: automation/pr138-takeover
          BASE: 807adaa252cd4749e339b80d9ca9ce6dc35ddd13
        run: |
          git config user.email "46719676+future3OOO@users.noreply.github.com"
          git config user.name "future3000"
          git rm .github/workflows/pr138-takeover.yml
          git add -A
          git reset --soft "$BASE"
          git commit -m "fix(tdd): align public proof seams and unify CLI grammar"
          git push origin HEAD:refs/heads/$BRANCH \
            --force-with-lease=refs/heads/$BRANCH:${GITHUB_SHA}
