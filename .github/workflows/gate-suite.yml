name: gate suite

# The offline suite must be enforced by the repository, not asserted in a
# document. This first delivery slice owns the shared state primitives and
# quality gate; later slices extend the contract suite as their interfaces land.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the gate can diff against the PR base; a shallow
          # checkout leaves the changed set empty and the gate self-passes.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure git identity for harness repositories
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Gate Suite"
      - name: Python lint (ruff E9,F)
        # Pinned and isolated so the linted rule set never moves without an
        # operator choice; pytest is installed only to exercise the public
        # pytest RED-reach contract through the real runner.
        run: |
          pip install ruff==0.16.2 pytest==8.4.1
          ruff check --isolated --select E9,F .
      - name: Stage explicit no-change fixture call sites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = (
              "hooks/tests/test_workflow_ledger.py",
              "hooks/tests/test_review_summary.py",
              "hooks/tests/test_tdd_summary.py",
              "hooks/tests/test_workflow_hooks.py",
              "hooks/tests/test_pass_lifecycle.py",
              "hooks/tests/test_repoforge_workflow.py",
          )
          root = Path("/tmp/fixture-codemod")
          for name in targets:
              source = Path(name)
              text = source.read_text(encoding="utf-8")
              text = text.replace("build_document", "build_no_change_document")
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: explicit-fixture-codemod
          path: /tmp/fixture-codemod
      - name: Integrated package contracts
        run: bash hooks/tests/run.sh
      - name: Package gate against the pull-request delta
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -n "$base" ]; then
            python3 skills/production-code/scripts/code_quality_gate.py check --repo . --base-ref "$base"
          else
            python3 skills/production-code/scripts/code_quality_gate.py check --repo . --base-ref "${{ github.event.before }}"
          fi
