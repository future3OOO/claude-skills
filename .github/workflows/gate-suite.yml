name: gate suite

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Advisor wrapper contracts
        run: bash skills/codex-advisor/tests/test-ask-codex-advisor.sh
      - name: Commit approval contracts
        run: python3 hooks/tests/test_commit_approval.py
      - name: Protected path contracts
        run: python3 hooks/tests/test_protected_path_gate.py
      - name: Prove the repository-local hook is active
        run: |
          git config --local user.name "Hook Probe"
          git config --local user.email "hook-probe@example.com"
          git config --local core.hooksPath .githooks
          if git commit --allow-empty -m hook-probe 2>hook-probe.err; then
            echo "pre-commit hook did not refuse an unapproved commit" >&2
            exit 1
          fi
          grep -q BLOCKED hook-probe.err
