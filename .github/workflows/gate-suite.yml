name: gate suite

# Temporary self-application step for the explicit fixture codemod. Removed in
# the next commit after the branch contains the generated source changes.
permissions:
  contents: write

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tdd-behavior-map-evidence
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure git identity for harness repositories
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Gate Suite"
      - name: Apply explicit no-change fixture call sites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = (
              "hooks/tests/test_workflow_ledger.py",
              "hooks/tests/test_review_summary.py",
              "hooks/tests/test_tdd_summary.py",
              "hooks/tests/test_workflow_hooks.py",
              "hooks/tests/test_pass_lifecycle.py",
              "hooks/tests/test_repoforge_workflow.py",
          )
          for name in targets:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              path.write_text(
                  text.replace("build_document", "build_no_change_document"),
                  encoding="utf-8",
              )
          PY
          if ! git diff --quiet -- hooks/tests; then
            git add hooks/tests
            git commit -m "test(workflow): make no-change fixture scope explicit"
            git push origin HEAD:fix/tdd-behavior-map-evidence
          fi
      - name: Python lint (ruff E9,F)
        run: |
          pip install ruff==0.16.2 pytest==8.4.1
          ruff check --isolated --select E9,F .
      - name: Integrated package contracts
        run: bash hooks/tests/run.sh
      - name: Package gate against the pull-request delta
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -n "$base" ]; then
            python3 skills/production-code/scripts/code_quality_gate.py check --repo . --base-ref "$base"
          else
            python3 skills/production-code/scripts/code_quality_gate.py check --repo . --base-ref "${{ github.event.before }}"
          fi
